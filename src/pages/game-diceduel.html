<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра дуэль на кубиках</title>
</head>
<body class="dices">
    <main class="container">
<section class="game">
            <h2 class="game-title">Игра «Дуэль на кубиках»</h2>
            <p class="game-description">Бросай кубик, побеждает тот, у кого выпадет больше</p>
            <div class="dice-container">
                <div class="dice-card">
                    <div class="dice-name"></div>
                    <div class="dice">⚀</div>
                </div>
                <div class="versus">VS</div>
                <div class="dice-card">
                    <div class="dice-name"></div>
                    <div class="dice">⚀</div>
                </div>
            </div>
            <button class="roll-button">Бросить кубик</button>
        </section>
        <aside class="status">
            <h2 class="statud-title"></h2>
            <div class="score-container">
                <div class="score-item"></div>
                <div class="sore-name">Ты</div>
                <div class="score">0</div>
            </div>
        <div class="score-item">
                <div class="sore-name">Компьютер</div>
                <div class="score">0</div>
        </div>
        <div class="result">
            <h3 class="hisnore-tiyle"> история раундов</h3>
            <div class="hisnory"> 
                <div class="hisnory-item history-grey"> 3 — 3 </div>
                <div class="hisnory-item history-red"> 2 — 5 </div>
                <div class="hisnory-item history-green"> 5 — 1 </div>
            </div>
        </div>
        </aside>
    </main>
</body>
</html>
